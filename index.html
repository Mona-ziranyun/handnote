<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大纲转手写笔记</title>
<link rel="stylesheet" href="styles.css?v=10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 20 L6 14 L16 4 L20 8 L10 18 Z' fill='%233d5bdb'/></svg>">
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f2329" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20 L6 14 L16 4 L20 8 L10 18 Z" fill="#1f2329"/><path d="M14 6 L18 10" stroke="#fff"/></svg>
      大纲转手写笔记
    </div>
    <div class="doc-meta">
      <div class="docs-menu">
        <button class="btn icon" id="docsBtn" title="我的笔记"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="dropdown" id="docsDropdown"></div>
      </div>
      <input class="doc-title-input" id="docTitle" title="点击修改笔记标题">
      <span class="save-state" id="saveState">○ 已保存</span>
    </div>
    <div class="top-actions">
      <button class="btn icon" id="undoBtn" title="撤销 (⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon" id="redoBtn" title="重做 (⇧⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn" id="syntaxBtn">笔记语法</button>
      <button class="btn" id="exportMdBtn">导出 Markdown</button>
      <button class="btn" id="exportPngBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 19h16"/></svg>导出 PNG</button>
      <button class="btn primary" id="batchBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>批量生成</button>
    </div>
  </header>

  <!-- 左：大纲 -->
  <aside class="outline">
    <div class="outline-tools">
      <button class="btn" id="addItemBtn">＋ 新建文本段落</button>
      <button class="btn" id="importMdBtn">⇪ 导入 Markdown</button>
      <button class="btn" id="addChapBtn" style="grid-column:1/3">＋ 新建章节</button>
    </div>
    <div class="outline-list" id="outlineList"></div>
    <div class="outline-tip">拖拽 ⋮⋮ 调整顺序，点击正文直接编辑</div>
    <div class="outline-count"><span id="countText"></span><span id="pageInfo"></span></div>
  </aside>

  <!-- 中：画布 -->
  <main class="canvas-col">
    <div class="canvas-bar">
      <span id="canvasHint">点击纸面上任意段落即可编辑</span>
      <span class="sp"></span>
      <button class="btn small" id="reseedBtn" title="换一种手绘笔触随机效果">🎲 换笔触</button>
      <button class="btn small" id="zoomOut">－</button>
      <span class="zoom-val" id="zoomVal">100%</span>
      <button class="btn small" id="zoomIn">＋</button>
      <button class="btn small" id="zoomFit">适应</button>
    </div>
    <div class="canvas-scroll" id="canvasScroll">
      <div class="page-holder" id="pageHolder"><div class="page page-shadow" id="page"></div></div>
      <div class="float-editor" id="floatEditor">
        <div class="fe-head"><span id="feLabel">编辑段落</span><span><button class="btn small" id="feDelete">删除</button> <button class="btn small" id="feClose">完成</button></span></div>
        <div class="mk-toolbar" data-target="feText"></div>
        <textarea id="feText" spellcheck="false"></textarea>
      </div>
    </div>
  </main>

  <!-- 右：样式 -->
  <aside class="settings" id="settings"></aside>
</div>

<!-- 导入 Markdown -->
<div class="modal-mask" id="mdModal">
  <div class="modal">
    <div class="modal-head">导入 Markdown<button data-close>×</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-top:0"># 一级标题 → 笔记标题；紧跟的 &gt; 引用 → 副标题；## 二级标题 → 章节；章节下的每个列表项 / 段落 / ### 小标题块 → 一个文本段落。</p>
      <textarea class="md-input" id="mdInput" placeholder="# 我的笔记标题&#10;&gt; 核心原则：……&#10;&#10;## 第一章&#10;- 要点一 -> 结果&#10;- **重点**内容&#10;&#10;## 第二章&#10;### 小标题&#10;正文……"></textarea>
      <div style="display:flex;gap:16px;align-items:center;margin-top:10px;font-size:13px">
        <label class="btn small" style="cursor:pointer">选择 .md 文件<input type="file" id="mdFile" accept=".md,.markdown,.txt" hidden></label>
        <label><input type="radio" name="mdMode" value="new" checked> 新建一份笔记</label>
        <label><input type="radio" name="mdMode" value="replace"> 替换当前笔记</label>
        <label><input type="radio" name="mdMode" value="append"> 追加到当前笔记</label>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="mdImportGo">导入</button></div>
  </div>
</div>

<!-- 语法帮助 -->
<div class="modal-mask" id="syntaxModal">
  <div class="modal">
    <div class="modal-head">笔记语法（在段落文字里直接写）<button data-close>×</button></div>
    <div class="modal-body">
      <table class="syntax-table" id="syntaxTable"></table>
    </div>
    <div class="modal-foot"><button class="btn primary" data-close>知道了</button></div>
  </div>
</div>

<!-- 批量生成 -->
<div class="modal-mask" id="batchModal">
  <div class="modal wide">
    <div class="modal-head">批量生成小红书卡片<button data-close>×</button></div>
    <div class="modal-body">
      <div class="batch-opts">
        <label>拆分方式
          <select class="set-select" id="bSplit" style="width:auto">
            <option value="1">每个章节一张</option>
            <option value="2">每 2 个章节一张</option>
            <option value="3">每 3 个章节一张</option>
            <option value="all">整篇一张</option>
          </select></label>
        <label>尺寸
          <select class="set-select" id="bSize" style="width:auto">
            <option value="xhs">小红书 3:4</option>
            <option value="a4">A4 竖版</option>
            <option value="square">正方形</option>
            <option value="long">长图</option>
          </select></label>
        <label><input type="checkbox" id="bCover" checked> 加封面（标题 + 目录）</label>
        <label><input type="checkbox" id="bPageNo" checked> 角标页码</label>
        <label>清晰度
          <select class="set-select" id="bRatio" style="width:auto"><option value="2">2 倍</option><option value="1.5">1.5 倍</option><option value="3">3 倍</option></select></label>
      </div>
      <div class="batch-grid" id="batchGrid"><div class="batch-empty">按当前的纸张、配色、笔触和字体，把笔记拆成多张卡片。点击「开始生成」预览。</div></div>
    </div>
    <div class="modal-foot"><span id="batchStatus" class="hint" style="margin:0 auto 0 0;align-self:center"></span><button class="btn" id="batchGo">开始生成</button><button class="btn primary" id="batchZip" disabled>下载 ZIP</button></div>
  </div>
</div>

<div class="offscreen" id="offscreen"></div>
<div class="toast" id="toast"></div>

<script src="lib/rough.js?v=10"></script>
<script src="lib/html-to-image.js?v=10"></script>
<script src="lib/jszip.min.js?v=10"></script>
<script src="render.js?v=10"></script>
<script src="samples.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
